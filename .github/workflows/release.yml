name: Release

# Run manually (Actions tab -> Release -> Run workflow) to build the Windows
# installer and download it from the run's artifacts.
# To build and attach it to a draft Release automatically on version tags,
# add under `on:`:   push: { tags: ["v*"] }
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Optional code signing: add these two repository secrets to sign (see docs/SIGNING.md).
      SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Inno Setup
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Prepare code-signing certificate (only if the secrets exist)
        if: ${{ env.SIGNING_PFX_BASE64 != '' }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          "TD_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          "TD_SIGN_PFX_PASSWORD=$env:SIGNING_PFX_PASSWORD" >> $env:GITHUB_ENV

      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: TopDisplay-Setup
          path: |
            dist/TopDisplay-Setup-*.exe
            dist/TopDisplay-Setup-*.exe.sha256

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/TopDisplay-Setup-*.exe
            dist/TopDisplay-Setup-*.exe.sha256
